name: Feature request
description: Suggest a new colour, aesthetic, or capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request
      options:
        - A new colour
        - A new aesthetic mode
        - Support for another custom card
        - A change to existing styling
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What would you like
      description: Describe the outcome, not the implementation
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What are you trying to do that the theme makes hard today?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Adding a colour yourself is one line.** See `build/areas.py` and the
        "Add a colour" section in CONTRIBUTING.md — you may not need to wait for this.

  - type: textarea
    id: refs
    attributes:
      label: References
      description: Screenshots, links, palettes, or anything else that shows what you mean
